services:
  db:
    # align major version with AWS RDS version
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: marine
      POSTGRES_PASSWORD: marine
      POSTGRES_DB: marine
    ports:
      - 54321:5432
    command: -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.max=10000 -c track_activity_query_size=2048 -c pg_stat_statements.track=all
    networks:
      - default

  db-init:
    image: flyway/flyway:13.9.0-alpine@sha256:ae8e985a8caf73181a39aad823690f27d55c850d4c5cea92a94c0ce4b3943156
    volumes:
      - "./sql:/flyway/sql"
      - "./files:/flyway/conf"
    command: "migrate"
    depends_on:
      - db
    networks:
      - default

  pghero:
    image: ankane/pghero
    restart: always
    environment:
      DATABASE_URL: postgres://marine:marine@db:5432/marine
    ports:
      - 8081:8080
    depends_on:
      - db
    networks:
      - default

networks:
  default:
    name: dbmarine
