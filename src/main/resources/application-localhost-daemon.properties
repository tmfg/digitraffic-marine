# Shared localhost-daemon defaults. Edit this file when changes should be versioned.
# For personal local tests, copy this to a gitignored application-<name>-daemon.properties profile and run with that profile.
spring.main.banner-mode=off

# http-server port
server.port = 9001

marine.datasource.url=jdbc:postgresql://localhost:54321/marine?reWriteBatchedInserts=true&ApplicationName=marine-localhost-daemon
marine.datasource.username=marine
marine.datasource.password=marine
marine.datasource.hikari.maximum-pool-size=6
marine.datasource.hikari.minimum-idle=6

# MQTT properties stored in AWS Secrets Manager in deployed environments
mqtt.server.url=tcp://10.10.10.10:1883
mqtt.server.username=updater
mqtt.server.password=change-me

dt.portnet.portcall.url = https://sosotes.trafi.fi/liikennevaline/vesiliikenne/satamakaynti/v1.0
dt.portnet.vesselDetails.url = https://sosotes.trafi.fi/liikennevaline/vesiliikenne/alustiedot/v1.0

# AIS properties stored in AWS Secrets Manager in deployed environments
ais.connector.address =
ais.connector.port =
ais.connector.user =
ais.connector.password =
ais.connector.socket.timeout = 10000
ais.connector.socket.keep-alive-timeout = 30000
ais.connector.socket.keep-alive-initial-delay = 20000
ais.connector.socket.keep-alive-fixed-delay = 10000

metadata.csv.baseUrl = https://raw.githubusercontent.com/tmfg/metadata/master/csv/

# Job schedules in ms or by cron in UTC
dt.job.SseReportUpdateJobUpdateJob.schedule =     0/30 * * * * ?
dt.job.PortCallUpdateJob.schedule =               0 * * * * ?
dt.job.VesselDetailsUpdateJob.schedule =          0 0/30 * * * ?
dt.job.BerthUpdateJob.schedule =                  0 0 0/12 * * ?
dt.job.SsnLocationUpdateJob.schedule =            0 0 0/12 * * ?

# Other scheduling related properties
portCallUpdateJob.maxTimeFrameToFetch = 360000
portCallUpdateJob.overlapTimeFrame = 2000

# Allowed mmsis cache time in millis
cache.allowedMmsis = #{60*1000}

# daemon or web
app.type=daemon

# Web application type. Should be none for daemon process
spring.main.web-application-type=none

# Enable only when ais.connector.* properties are configured.
ais.reader.enabled=false

# Enable only when a local MQTT broker is configured.
ais.mqtt.enabled=false
sse.mqtt.enabled=false

# Is metadata updates on. Should be true only for daemon processes.
quartz.enabled=true

# Logging
logging.level.fi.livi.digitraffic.meri=INFO
logging.level.fi.livi.digitraffic.meri.service.portnet.call.PortCallClient=DEBUG

# Port call estimate api key stored in AWS Secrets Manager in deployed environments
portcallestimate.urls=https://portactivity-test.digitraffic.fi/api/integration/timestamps/
# portcallestimate.apikeys=xxx,yyy
