# Shared localhost-web defaults. Edit this file when changes should be versioned.
# For personal local tests, copy this to a gitignored application-<name>-web.properties profile and run with that profile.
spring.main.banner-mode=off

# http-server port
server.port = 9001

marine.datasource.url=jdbc:postgresql://localhost:54321/marine?reWriteBatchedInserts=true&ApplicationName=marine-localhost-web
marine.datasource.username=marine
marine.datasource.password=marine
marine.datasource.hikari.maximum-pool-size=10
marine.datasource.hikari.minimum-idle=10

dt.pooki.url = https://extranet.vayla.fi/pooki_www/services/rest.ashx
dt.portnet.portcall.url = https://sosotes.trafi.fi/liikennevaline/vesiliikenne/satamakaynti/v1.0
dt.portnet.vesselDetails.url = https://sosotes.trafi.fi/liikennevaline/vesiliikenne/alustiedot/v1.0

# Allowed mmsis cache time in millis
cache.allowedMmsis = #{60*1000}

# daemon or web
app.type=web

# Web application type. Should be none for daemon process and servlet for web app
spring.main.web-application-type=servlet

# Domain for the app ie. https://digitraffic.fi
dt.domain.url=http://localhost:9001

# If set to false tcp ais radio message reading is not activated. Should be true for daemon processes
ais.reader.enabled=false

# if set to false no messages are sent to mqtt. Should be true for daemon process
ais.mqtt.enabled=false
sse.mqtt.enabled=false

# Is metadata updates on. Should be true only for daemon processes.
quartz.enabled=false

# Logging
logging.level.fi.livi.digitraffic.meri=INFO

# enable virtual threads
spring.threads.virtual.enabled=true
