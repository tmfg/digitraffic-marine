name: Update Swagger
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: environment
        default: "test"
jobs:
  update-swagger:
    if: github.repository != 'tmfg/digitraffic-marine'
    environment: ${{ github.event.inputs.env }}
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Log workflow inputs
        uses: tmfg/digitraffic-actions@24e33d7e6d14273dde9094c5172e8b440a70440c # log-workflow-inputs/v1
        with:
          inputs: ${{ toJSON(inputs) }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SWAGGER_ROLE }}
          role-session-name: gh-actions-update-swagger-marine-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Set environment name
        run: |
          SWAGGER_ENV_NAME=$(echo ${{ github.event.inputs.env }} | awk '{print toupper(substr($0, 1, 1)) substr($0, 2)}')
          echo "SWAGGER_ENV_NAME=$SWAGGER_ENV_NAME" >> $GITHUB_ENV
      - name: Update API Gateway documentation
        run: |
          invoke_result=$(aws lambda invoke --region ${{ secrets.AWS_REGION }} --function-name SwaggerJoinerMarine${{ env.SWAGGER_ENV_NAME }}-UpdateApiGwDocumentation --log-type Tail update-api-docs-result.json)
          echo "${invoke_result}"
          # The error details are in the response payload and in the log tail,
          # not in the invoke metadata. Print both so failures show up here.
          echo "--- Lambda response ---"
          cat update-api-docs-result.json; echo
          echo "--- Lambda log tail ---"
          echo "${invoke_result}" | jq -r '.LogResult // empty' | base64 --decode || true
          if grep -q "FunctionError" <<< "${invoke_result}"; then echo "There was an error executing lambda"; exit 1; fi
      - name: Update Swagger documentation
        run: |
          invoke_result=$(aws lambda invoke --region ${{ secrets.AWS_REGION }} --function-name SwaggerJoinerMarine${{ env.SWAGGER_ENV_NAME }}-UpdateSwaggerDescriptions --log-type Tail update-swagger-docs-result.json)
          echo "${invoke_result}"
          echo "--- Lambda response ---"
          cat update-swagger-docs-result.json; echo
          echo "--- Lambda log tail ---"
          echo "${invoke_result}" | jq -r '.LogResult // empty' | base64 --decode || true
          if grep -q "FunctionError" <<< "${invoke_result}"; then echo "There was an error executing lambda"; exit 1; fi

